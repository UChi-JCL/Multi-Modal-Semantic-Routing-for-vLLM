[project]
name = "multi-modal-semantic-routing-for-vllm"
version = "0.1.0"
description = "Accent-aware STT routing research for vLLM — synthetic accented speech data generation, STT fine-tuning, and routing."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "jiwer>=3.0",
  "soundfile>=0.12",
  "scipy>=1.13",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
